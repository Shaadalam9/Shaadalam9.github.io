<nav class="navbar navbar-default navbar-fixed-top site-nav">
  <div class="container-fluid">
    <div class="navbar-header">
      <button type="button" class="theme-toggle theme-toggle-mobile" aria-label="Switch to dark mode" title="Switch theme"><i class="fa fa-moon-o"></i></button>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-collapse-1" aria-controls="navbar-collapse-1" aria-expanded="false" aria-label="Toggle navigation">
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" href="{{ site.url }}{{ site.baseurl }}/">{{ site.title | escape }}</a>
    </div>
    <div class="collapse navbar-collapse" id="navbar-collapse-1">
      <ul class="nav navbar-nav navbar-right">
        <li{% if page.url == "/" %} class="active"{% endif %}><a href="{{ site.url }}{{ site.baseurl }}/">Home</a></li>
        {% for nav in site.nav_pages %}
          {% capture nav_path %}/{{ nav.name }}/{% endcapture %}
          <li{% if page.url == nav_path or page.collection == nav.name %} class="active"{% endif %}><a href="{{ site.url }}{{ site.baseurl }}/{{ nav.name }}/">{% if nav.label %}{{ nav.label }}{% else %}{{ nav.name | capitalize }}{% endif %}</a></li>
        {% endfor %}
        <li class="theme-toggle-item"><button type="button" class="theme-toggle" aria-label="Switch to dark mode" title="Switch theme"><i class="fa fa-moon-o"></i></button></li>
      </ul>
    </div>
  </div>
</nav>
